name: hello
port: 8080
health: {live: /healthz, ready: /readyz}
smoke:
  - {path: /, expect: 200}
  - {path: /api/v1/ping, expect: 200, contains: "pong"}
env: [SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
      OIDC_ISSUER, OIDC_INTERNAL_ISSUER, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET,   # the OIDC_* values come from `avk auth client`
      SMTP_HOST, SMTP_PORT, SMTP_SSL, SMTP_USERNAME, SMTP_PASSWORD, MAIL_FROM, SUPPORT_TO]   # the SMTP_* values come from `avk legal smtp`
migrations: {tool: flyway, command: ["java", "-jar", "/app/app.jar", "--migrate-only"]}
build: ["cmd", "/c", ".\\check.cmd"]   # optional: local PC build that produces what the Dockerfile packages (avk stg up --build)

# Policy pages, cookie notice, contact page and security.txt are generated by `avk legal render hello` (platform repo).
# They are a DRAFT, not legal advice, until the owner sets reviewed: true. Anything missing renders as [TO COMPLETE].
legal:
  reviewed: false
  app_title: hello
  legal_name: AVK Explorer            # placeholder: put the real person or business name here
  postal_address: ""                  # PO box or virtual address; never a home address
  effective_date: "2026-11-25"
  accounts: true
  regions: [tx]
  analytics: []                       # none: the banner is a one-time notice about essential cookies only
  processors: [cloudflare, resend]
  data_collected: [Email address and name (when you sign up), Messages you send through the contact form]
  data_location: "A computer in Texas, USA, plus encrypted backups held by Cloudflare in the United States"
  retention: "Account data until you delete your account; login activity records 30 days"   # owner to add contact-message and backup retention
  sells_goods: false
  subscriptions: false
  physical_goods: false
  footer_into: [src/main/resources/static/index.html]
