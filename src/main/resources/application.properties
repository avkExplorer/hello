spring.application.name=hello
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never
server.error.include-stacktrace=never

# One JSON log line per event on stdout.
logging.structured.format.console=ecs

# Database settings come only from the environment: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD. Migrations use the separate migrator role: SPRING_FLYWAY_USER, SPRING_FLYWAY_PASSWORD.
spring.flyway.locations=classpath:db/migration

# Login (Keycloak). All values come from the environment written by `avk auth client`; with no OIDC_CLIENT_ID the app
# runs without login (public pages only). Sessions are server-side in an HttpOnly, SameSite=Lax cookie; Secure unless
# COOKIE_SECURE=false (stg on plain http://127.0.0.1).
avk.auth.issuer=${OIDC_ISSUER:}
avk.auth.internal-issuer=${OIDC_INTERNAL_ISSUER:}
avk.auth.client-id=${OIDC_CLIENT_ID:}
avk.auth.client-secret=${OIDC_CLIENT_SECRET:}
# Metrics (Prometheus format) on a SEPARATE management port. Traefik only routes 8080, and the container's 8081 is never published,
# so only containers on the private avk network (the optional `avk obs` Prometheus) can read it. Nothing else is exposed.
management.server.port=8081
management.endpoints.web.exposure.include=prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Contact form (written by `avk legal smtp`). No SMTP_HOST means the form answers 503 and points to the support address.
# TURNSTILE_SECRET switches the Cloudflare bot check on (the page then needs the matching site key in avk.yaml legal.turnstile_site_key).
avk.contact.smtp-host=${SMTP_HOST:}
avk.contact.smtp-port=${SMTP_PORT:25}
avk.contact.smtp-ssl=${SMTP_SSL:false}
avk.contact.smtp-username=${SMTP_USERNAME:}
avk.contact.smtp-password=${SMTP_PASSWORD:}
avk.contact.mail-from=${MAIL_FROM:noreply@notify.avkaiexplorer.com}
avk.contact.support-to=${SUPPORT_TO:support@avkaiexplorer.com}
avk.contact.ticket-prefix=HEL
avk.contact.turnstile-secret=${TURNSTILE_SECRET:}
avk.contact.per-minute=5
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
