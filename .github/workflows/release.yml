# Runs on every merge to main: repeat the gates on the merge result, build ONE signed image, prove it in the ci stack,
# then wait for the owner's approval of `prod`. Nothing here connects to the owner's PC.
# Follows the platform's `main` while it is built; pinned to a commit SHA once the workflows settle.
name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    permissions:
      contents: read
      security-events: write
    uses: avkExplorer/avk-platform/.github/workflows/ci.yml@main
    with:
      coverage-minimum: "0.70"

  release:
    needs: gates
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: avkExplorer/avk-platform/.github/workflows/release.yml@main
    with:
      app-name: hello
      expected-identity: https://github.com/avkExplorer/avk-platform/.github/workflows/release.yml@refs/heads/main

  approve:
    needs: release
    permissions:
      contents: read
      packages: read
      id-token: write
      deployments: write
    uses: avkExplorer/avk-platform/.github/workflows/approve.yml@main
    with:
      app-name: hello
      image: ${{ needs.release.outputs.image }}
      digest: ${{ needs.release.outputs.digest }}
