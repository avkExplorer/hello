# Pull request gates. The real work lives in the platform repo's reusable workflow.
# While the platform is being built this follows `main`; it is pinned to a commit SHA once the workflows settle.
name: ci

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
      security-events: write
    uses: avkExplorer/avk-platform/.github/workflows/ci.yml@main
    with:
      coverage-minimum: "0.70"
